name: M2 election setup acceptance

on:
  pull_request:
    branches: [feat/m0-vinext-foundation]
    paths:
      - 'app/actions/elections.ts'
      - 'app/organizations/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/contracts.test.mjs'
      - '.github/workflows/m2-election-setup.yml'

permissions:
  contents: read

concurrency:
  group: m2-election-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  election-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Database acceptance is centralized in the M1+M2 workflow to avoid duplicate Supabase stacks.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run application contract, type and compatibility checks
        run: npm run check
      - name: Build production Worker
        run: npm run build:vinext
      - name: Stop disposable local stack
        if: always()
        run: npx --yes supabase@2.100.0 stop --no-backup
