name: Database acceptance (M1 + M2)

on:
  pull_request:
    branches: [main, feat/m0-vinext-foundation]
    paths:
      - 'app/actions/auth.ts'
      - 'app/actions/organization-members.ts'
      - 'app/auth/**'
      - 'app/invitations/**'
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/organizations/**'
      - 'lib/navigation.ts'
      - 'supabase/functions/send-organization-invitation/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/m2-election-setup.yml'
      - 'tests/contracts.test.mjs'
      - '.github/workflows/m1-organization-members.yml'

permissions:
  contents: read

concurrency:
  group: m1-organization-members-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run application contract, type and compatibility checks
        run: npm run check
      - name: Start disposable local Supabase
        run: npx --yes supabase@2.114.0 start -x edge-runtime,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,studio,supavisor,vector
      - name: Apply repository migrations to disposable database
        run: npx --yes supabase@2.114.0 db reset --local --no-seed
      - name: Export local database connection
        run: npx --yes supabase@2.114.0 status -o env | awk -F '"' '/^DB_URL=/{print "DB_URL=" $2}' >> "$GITHUB_ENV"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify all database transaction and security invariants
        run: |
          for test_file in supabase/tests/*.sql; do
            echo "Running $test_file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - name: Stop disposable local stack
        if: always()
        run: npx --yes supabase@2.114.0 stop --no-backup
