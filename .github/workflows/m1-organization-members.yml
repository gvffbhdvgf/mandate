name: M1 organization membership acceptance

on:
  pull_request:
    branches: [feat/m0-vinext-foundation]
    paths:
      - 'app/actions/auth.ts'
      - 'app/actions/organization-members.ts'
      - 'app/auth/**'
      - 'app/invitations/**'
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/organizations/**'
      - 'lib/navigation.ts'
      - 'supabase/functions/send-organization-invitation/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/organization_membership_invitation_smoke.sql'
      - 'tests/contracts.test.mjs'
      - '.github/workflows/m1-organization-members.yml'

permissions:
  contents: read

concurrency:
  group: m1-organization-members-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  organization-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run application contract, type and compatibility checks
        run: npm run check
      - name: Start disposable local Supabase
        run: npx --yes supabase@2.100.0 start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector
      - name: Apply repository migrations to disposable database
        run: npx --yes supabase@2.100.0 db reset --local --no-seed
      - name: Export local database connection
        run: npx --yes supabase@2.100.0 status -o env | awk -F '"' '/^DB_URL=/{print "DB_URL=" $2}' >> "$GITHUB_ENV"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify organization invitation and membership invariants
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/organization_membership_invitation_smoke.sql
      - name: Stop disposable local stack
        if: always()
        run: npx --yes supabase@2.100.0 stop --no-backup
