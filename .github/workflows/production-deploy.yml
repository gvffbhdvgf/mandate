name: Mandate production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandate-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Validate and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run contract, type and compatibility checks
        run: npm run check

      - name: Build production Worker
        run: npm run build:vinext

      - name: Deploy the production Worker
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test production routes
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://mandate.markmachukhu97.workers.dev"
          sleep 5
          for route in / /login /signup; do
            name="$(echo "${route}" | tr '/' '_' | sed 's/^_$/home/')"
            body="/tmp/mandate-${name}"
            echo "Checking ${APP_URL}${route}"
            status="$(curl --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 45 --max-time 20 --output "${body}" --write-out '%{http_code}' "${APP_URL}${route}" || true)"
            if [[ "${status}" != "200" ]]; then
              echo "Production route ${route} returned HTTP ${status}"
              sed -n '1,100p' "${body}" || true
              exit 1
            fi
          done
          grep -q "Organizational elections" /tmp/mandate-home
          grep -q "Sign in to Mandate" /tmp/mandate-_login
          grep -q "Create your account" /tmp/mandate-_signup
