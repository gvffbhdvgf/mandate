name: M0 Cloudflare foundation

on:
  push:
    branches: [feat/m0-vinext-foundation]
    paths: [.github/workflows/m0-cloudflare-foundation.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m0-cloudflare-foundation
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M0 branch
        uses: actions/checkout@v4
        with:
          ref: feat/m0-vinext-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create minimal App Router application
        shell: bash
        run: |
          npm init -y
          node -e "const fs=require('fs'); const p=require('./package.json'); p.name='mandate'; p.private=true; p.type='module'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\\n')"
          mkdir -p app
          cat > app/layout.tsx <<'EOF'
          import type { ReactNode } from "react";
          import "./globals.css";

          export const metadata = {
            title: "Mandate — Organizational elections, made clear",
            description: "A clear, accountable election service for organizations.",
          };

          export default function RootLayout({ children }: { children: ReactNode }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            );
          }
          EOF
          cat > app/page.tsx <<'EOF'
          export default function HomePage() {
            return (
              <main className="shell">
                <header className="topbar">
                  <a className="brand" href="/" aria-label="Mandate home">
                    <span className="brand-mark">M</span>
                    <span>mandate</span>
                  </a>
                  <span className="eyebrow">ORGANIZATIONAL ELECTIONS</span>
                </header>
                <section className="hero">
                  <p className="kicker">CLEAR PROCESS. CONFIDENT DECISIONS.</p>
                  <h1>Organizational elections,<br /><em>made clear.</em></h1>
                  <p className="intro">
                    A guided, accountable way to plan and run elections for the
                    organizations that bring people together.
                  </p>
                  <div className="status">M0 foundation · Runtime validation</div>
                </section>
                <footer>Mandate · Built for transparent organizational decision-making</footer>
              </main>
            );
          }
          EOF
          cat > app/globals.css <<'EOF'
          :root {
            color-scheme: light;
            --forest: #1F3D32;
            --jade: #3E735B;
            --gold: #B58A4A;
            --ivory: #F7F6F1;
            --ink: #202B25;
            --muted: #65736A;
            --border: #E3E8E1;
          }
          * { box-sizing: border-box; }
          html, body { min-height: 100%; }
          body { margin: 0; background: var(--ivory); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
          .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
          .topbar { height: 88px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
          .brand { display: inline-flex; gap: 11px; align-items: center; color: var(--forest); font-weight: 750; font-size: 21px; letter-spacing: -.04em; text-decoration: none; }
          .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: white; background: var(--forest); border-radius: 10px; font-family: Georgia, serif; }
          .eyebrow, .kicker { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .16em; }
          .hero { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 96px 0 120px; max-width: 760px; }
          .kicker { color: var(--jade); margin: 0 0 24px; }
          h1 { margin: 0; color: var(--forest); font-family: Georgia, "Times New Roman", serif; font-size: clamp(48px, 7vw, 84px); font-weight: 500; line-height: .98; letter-spacing: -.055em; }
          h1 em { color: var(--jade); font-weight: 400; }
          .intro { max-width: 570px; color: var(--muted); font-size: 18px; line-height: 1.7; margin: 28px 0 34px; }
          .status { padding: 10px 14px; border: 1px solid var(--border); border-radius: 999px; color: var(--forest); background: white; font-size: 12px; font-weight: 650; }
          footer { padding: 24px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
          @media (max-width: 600px) { .shell { width: min(100% - 32px, 1120px); } .eyebrow { font-size: 9px; letter-spacing: .1em; } .hero { padding: 72px 0 90px; } .intro { font-size: 16px; } }
          EOF
          cat > .gitignore <<'EOF'
          node_modules/
          .next/
          .vinext/
          .cloudflare/
          .wrangler/
          .dev.vars
          .env*
          !.env.example
          dist/
          coverage/
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["dom", "dom.iterable", "esnext"],
              "allowJs": true,
              "skipLibCheck": true,
              "strict": true,
              "noEmit": true,
              "esModuleInterop": true,
              "module": "esnext",
              "moduleResolution": "bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve",
              "incremental": true,
              "plugins": [{ "name": "next" }]
            },
            "include": ["**/*.ts", "**/*.tsx", ".cloudflare/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          EOF

      - name: Initialize vinext for Workers Cache, KV and Images
        run: npx --yes vinext init --platform=cloudflare --cdn-cache=workers-cache --data-cache=kv --image-optimization=cloudflare-images --no-prerender --warm-cache

      - name: Bind the existing EU KV namespace
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          const path = "cloudflare.config.ts";
          if (!fs.existsSync(path)) throw new Error("vinext did not generate cloudflare.config.ts");
          let source = fs.readFileSync(path, "utf8");
          if (!source.includes("bindings.kv(")) throw new Error("Expected generated KV binding was not found");
          source = source.replace("bindings.kv()", 'bindings.kv({ id: "8df55d8d27e74f058c2ae3013ae71ded" })');
          if (!source.includes("8df55d8d27e74f058c2ae3013ae71ded")) throw new Error("Could not bind the pre-provisioned EU KV namespace");
          if (!source.includes("bindings.images()")) throw new Error("Expected Cloudflare Images binding was not generated");
          fs.writeFileSync(path, source);
          EOF
          grep -q "workersCacheCdnAdapter" vite.config.ts
          grep -q "kvDataAdapter" vite.config.ts
          grep -q "imagesOptimizer" vite.config.ts

      - name: Build the Workers application
        run: npm run build:vinext

      - name: Commit generated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: scaffold vinext Cloudflare foundation"
          git push origin feat/m0-vinext-foundation
