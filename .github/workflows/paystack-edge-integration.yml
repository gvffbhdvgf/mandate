name: Paystack edge integration

on:
  push:
    branches: [feat/paystack-server-integration]
  pull_request:
    branches: [feat/m0-vinext-foundation]

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/_shared/paystack.ts
          deno check --node-modules-dir=none supabase/functions/paystack-initialize/index.ts
          deno check --node-modules-dir=none supabase/functions/paystack-verify/index.ts
          deno check --node-modules-dir=none supabase/functions/paystack-webhook/index.ts

      - name: Test Paystack webhook signature verification
        run: deno test --node-modules-dir=none --allow-env=PAYSTACK_WEBHOOK_SECRET supabase/functions/_shared/paystack.test.ts
