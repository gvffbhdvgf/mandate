name: Paystack edge integration

on:
  push:
    branches: [main, feat/m2-election-setup-lifecycle-next]
  pull_request:
    branches: [main, feat/m2-election-setup-lifecycle-next]

permissions:
  contents: read

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js and run repository contract tests
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci

      - name: Run repository contract tests
        run: node --test tests/contracts.test.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/_shared/paystack.ts
          deno check --node-modules-dir=none supabase/functions/paystack-initialize/index.ts
          deno check --node-modules-dir=none supabase/functions/paystack-verify/index.ts
          deno check --node-modules-dir=none supabase/functions/paystack-webhook/index.ts
          deno check --node-modules-dir=none supabase/functions/public-election-details/index.ts
          deno check --node-modules-dir=none supabase/functions/public-participant-session/index.ts
          deno check --node-modules-dir=none supabase/functions/public-vote-credit-intent/index.ts

      - name: Test Paystack webhook signature verification
        run: deno test --node-modules-dir=none --allow-env supabase/functions/_shared/paystack.test.ts
