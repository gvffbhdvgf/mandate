name: Mandate Cloudflare Preview

on:
  push:
    branches:
      - "preview/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandate-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated Worker Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact preview commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and deploy a Cloudflare Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f1e6b6afc248118ac6bd13519ac99c66
          CI: "true"
        run: npx vinext-cloudflare previews deploy --preview-name mandate-ui --mode preview
